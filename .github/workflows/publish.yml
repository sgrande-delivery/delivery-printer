name: Publish

on:
  push:
    branches:
      - master

jobs:
  publish:
    # Windows NSIS installers are built on Windows so no wine is involved.
    runs-on: windows-latest

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build renderer, preload and main
        run: npm run build

      # One electron-builder invocation covers both architectures, which keeps a
      # single latest.yml. Publishing the architectures in separate runs would
      # overwrite it and break auto update for one of them.
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: npx electron-builder --win --publish always
